<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Receipts">
<meta name="theme-color" content="#1f5f8b">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="icon" href="/icon.svg" type="image/svg+xml">
<title>{% block title %}Expenses{% endblock %} · {{ settings.business_name if settings else "AIG" }}</title>
<style>
:root { --bg:#f7f7f5; --card:#fff; --ink:#1d1d1b; --muted:#6b6b66; --line:#e3e3de; --accent:#1f5f8b; --warn:#a35a00; --ok:#2f7a3d; --bad:#a3261f; }
@media (prefers-color-scheme: dark) { :root { --bg:#151515; --card:#1f1f1f; --ink:#eee; --muted:#a0a09a; --line:#333; --accent:#6fb1e0; --warn:#f0a64a; --ok:#6cc27b; --bad:#ef7a72; } }
* { box-sizing: border-box; }
body { margin:0; font:15px/1.45 system-ui, -apple-system, Segoe UI, sans-serif; background:var(--bg); color:var(--ink); }
header { display:flex; flex-wrap:wrap; gap:16px; align-items:center; padding:12px 16px; border-bottom:1px solid var(--line); background:var(--card); }
header strong { font-size:17px; margin-right:auto; }
header a { color:var(--ink); text-decoration:none; }
header a:hover { color:var(--accent); }
main { max-width:1100px; margin:0 auto; padding:16px; }
.card { background:var(--card); border:1px solid var(--line); border-radius:10px; padding:16px; margin-bottom:16px; }
h1 { font-size:22px; margin:0 0 12px; } h2 { font-size:17px; margin:0 0 10px; }
table { width:100%; border-collapse:collapse; } th, td { text-align:left; padding:7px 8px; border-bottom:1px solid var(--line); vertical-align:top; }
th { font-size:13px; color:var(--muted); font-weight:600; } td.num, th.num { text-align:right; font-variant-numeric:tabular-nums; white-space:nowrap; }
tr.clickable { cursor:pointer; } tr.clickable:hover td { background:color-mix(in srgb, var(--accent) 7%, transparent); }
.muted { color:var(--muted); } .small { font-size:13px; }
.pill { display:inline-block; font-size:12px; padding:1px 8px; border-radius:99px; border:1px solid currentColor; white-space:nowrap; }
.pill.review { color:var(--warn); } .pill.confirmed { color:var(--ok); } .pill.low { color:var(--bad); }
button, .btn { font:inherit; padding:8px 14px; border-radius:8px; border:1px solid var(--line); background:var(--card); color:var(--ink); cursor:pointer; text-decoration:none; display:inline-block; }
button.primary, .btn.primary { background:var(--accent); border-color:var(--accent); color:#fff; }
button.danger { color:var(--bad); }
input, select, textarea { font:inherit; padding:7px 9px; border:1px solid var(--line); border-radius:7px; background:var(--bg); color:var(--ink); width:100%; }
label { display:block; font-size:13px; color:var(--muted); margin-bottom:3px; }
.grid { display:grid; grid-template-columns:repeat(auto-fill, minmax(140px, 1fr)); gap:12px; }
.row { display:flex; flex-wrap:wrap; gap:10px; align-items:center; }
.split { display:grid; grid-template-columns: 1fr 1fr; gap:16px; } @media (max-width: 800px) { .split { grid-template-columns: 1fr; } .hide-sm { display:none; } }
.drop { border:2px dashed var(--line); border-radius:10px; padding:20px; text-align:center; }
.notice { border-left:4px solid var(--warn); padding:8px 12px; background:color-mix(in srgb, var(--warn) 10%, transparent); border-radius:6px; margin-bottom:12px; }
.receipt img { max-width:100%; border-radius:8px; border:1px solid var(--line); }
.receipt iframe { width:100%; height:75vh; border:1px solid var(--line); border-radius:8px; }
.table-wrap { overflow-x:auto; }
.snap-btn { display:flex; flex-direction:column; align-items:center; justify-content:center; gap:10px; width:100%; min-height:42vh; border-radius:16px; background:var(--accent); color:#fff; font-size:22px; font-weight:600; cursor:pointer; border:none; text-align:center; padding:20px; }
.snap-btn svg { width:72px; height:72px; }
.snap-btn input { display:none; }
.busy { display:none; text-align:center; padding:30px 10px; font-size:18px; }
.busy.on { display:block; }
.spinner { width:42px; height:42px; border:4px solid var(--line); border-top-color:var(--accent); border-radius:50%; margin:0 auto 14px; animation:spin 0.9s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
.list-plain { list-style:none; padding:0; margin:0; } .list-plain li { padding:9px 0; border-bottom:1px solid var(--line); } .list-plain a { color:inherit; text-decoration:none; display:flex; justify-content:space-between; gap:10px; }
@media (max-width: 800px) {
  header { gap:12px; padding:10px 16px; font-size:15px; } header strong { width:100%; }
  .split .form-col { order:-1; }
  input, select, textarea { font-size:16px; }  /* stops iPhone zooming into fields */
  button, .btn { padding:11px 16px; }
}
</style>
</head>
<body>
<header>
  <strong>{{ settings.business_name if settings else "AIG" }} expenses</strong>
  <a href="/snap">Snap receipt</a>
  <a href="/">Expenses</a>
  <a href="/summary">Tax summary</a>
  <a href="/settings">Settings</a>
</header>
<main>
{% if excel_warning() %}<div class="notice">{{ excel_warning() }}</div>{% endif %}
{% block content %}{% endblock %}
</main>
</body>
</html>
