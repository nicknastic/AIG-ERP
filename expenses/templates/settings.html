{% extends "base.html" %}
{% block title %}Settings{% endblock %}
{% block content %}
<div class="card" style="max-width:640px">
  <h1>Settings</h1>
  {% if saved %}<div class="notice">Saved.</div>{% endif %}
  <form method="post" action="/settings">
    <div><label>Business name</label><input name="business_name" value="{{ settings.business_name }}" required></div>
    <div class="grid" style="margin-top:10px">
      <div><label>Partner 1</label><input name="partner_a_name" value="{{ settings.partner_a_name }}" required></div>
      <div><label>Share %</label><input type="number" step="0.01" min="0" max="100" name="partner_a_pct" value="{{ settings.partner_a_pct }}" required></div>
      <div><label>Partner 2</label><input name="partner_b_name" value="{{ settings.partner_b_name }}" required></div>
      <div><label>Share %</label><input type="number" step="0.01" min="0" max="100" name="partner_b_pct" value="{{ settings.partner_b_pct }}" required></div>
    </div>
    <div style="margin-top:10px"><label>Registered for GST/HST?</label>
      <select name="gst_registered">
        <option value="yes" {% if settings.gst_registered == "yes" %}selected{% endif %}>Yes, we claim input tax credits</option>
        <option value="no" {% if settings.gst_registered == "no" %}selected{% endif %}>No, GST is part of the expense</option>
      </select>
    </div>
    <p style="margin-top:14px"><button class="primary" type="submit">Save</button></p>
  </form>
  <p class="small muted">Automatic receipt reading: {{ "on" if extraction else "off (set ANTHROPIC_API_KEY, see README)" }}.</p>
</div>
{% endblock %}
