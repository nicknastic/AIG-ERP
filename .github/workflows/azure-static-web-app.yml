name: Deploy to Azure Static Web Apps

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  test-and-deploy:
    runs-on: ubuntu-latest
    env:
      HAS_TOKEN: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Run tests
        run: |
          pip install -r requirements-dev.txt
          pytest -q
      - name: Skip deploy until the token is set
        if: env.HAS_TOKEN != 'true'
        run: echo "AZURE_STATIC_WEB_APPS_API_TOKEN is not set yet; see deploy/AZURE.md. Tests passed, nothing deployed."
      - name: Deploy site and API
        if: env.HAS_TOKEN == 'true'
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          action: upload
          app_location: frontend
          api_location: api
          output_location: ""
          skip_app_build: true
