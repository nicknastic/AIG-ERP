name: Deploy to Azure

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      HAS_PROFILE: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run tests
        run: |
          pip install -r requirements-dev.txt
          pytest -q
      - name: Skip deploy until Azure is set up
        if: env.HAS_PROFILE != 'true'
        run: echo "AZURE_WEBAPP_PUBLISH_PROFILE is not set yet; see deploy/AZURE.md. Tests passed, nothing deployed."
      - name: Deploy to App Service
        if: env.HAS_PROFILE == 'true'
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ vars.AZURE_WEBAPP_NAME }}
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          package: .
